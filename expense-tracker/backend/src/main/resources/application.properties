# Dynamically toggle profiles (defaults to 'prod' on Render)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
spring.application.name=expense-tracker

# Fully dynamic Aiven MySQL connection string
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=true&sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Dynamically set port (Render assigns a random port via the PORT variable)
server.port=${PORT:8080}

# JWT configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web.filter=DEBUG